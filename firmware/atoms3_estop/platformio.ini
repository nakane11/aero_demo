; AtomS3R 非常停止ボタン ファームウェア (PlatformIO プロジェクト)
;
; 書き込み:
;   pio run -t upload
; シリアルモニタ:
;   pio device monitor -b 115200
;
; platformio-espressif32 (確認時点で espressif32@7.1.3) には
; "m5stack-atoms3r" ボード定義が無いため、ハードウェア (ESP32-S3/8MB
; flash/ボタンG41/画面GC9107) が共通の "m5stack-atoms3" を代わりに使う
; (`pio boards espressif32 | grep -i atom` で確認)。IMU/ToF 等の
; AtomS3R 固有センサはこのファームウェアでは使っていないので、M5Unified
; の実行時の自動判別 (M5.begin()) だけでボード定義の違いは吸収される。

[env:atoms3r]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified
